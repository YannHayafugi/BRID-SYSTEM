# =====================================================================
# Postgres · ajuste para o VPS (referência: KVM 4 — 4 vCPU, 16 GB)
#
# Os padrões do Postgres são deliberadamente conservadores, para caber em
# qualquer máquina. Com eles, o refresh das materialized views do SADA
# (~20 s por importação) e a ingestão por COPY ficam bem mais lentos do
# que precisam, porque quase tudo cai para disco.
#
# SE O VPS FOR DE OUTRO TAMANHO, ajuste proporcionalmente: a regra é
# shared_buffers ≈ 25% da RAM e effective_cache_size ≈ 75%.
# =====================================================================

# ---------------------------------------------------------------------
# Memória
# ---------------------------------------------------------------------
# 25% de 16 GB. O resto fica com o cache do sistema operacional, que o
# Postgres também aproveita — por isso não adianta subir muito mais.
shared_buffers = 4GB

# Não aloca nada: é uma ESTIMATIVA do cache total (Postgres + sistema) que
# o planejador usa para decidir entre varredura sequencial e índice.
# Subestimar aqui é o erro clássico que faz o banco ignorar índices.
effective_cache_size = 12GB

# Por operação de ordenação ou hash, e uma consulta pode ter várias. Os 4 MB
# padrão fazem o agrupamento do top de devedores (1,06 mi de linhas)
# estourar para disco — foi exatamente o que apareceu no plano antes das
# materialized views.
work_mem = 32MB

# Usado por CREATE INDEX, VACUUM e pelo REFRESH MATERIALIZED VIEW. Vale
# ser generoso: são operações pontuais e pesadas.
maintenance_work_mem = 1GB

# ---------------------------------------------------------------------
# Disco (NVMe)
# ---------------------------------------------------------------------
# O padrão (4.0) descreve disco mecânico e faz o planejador evitar índices
# sem motivo. Em NVMe o acesso aleatório custa quase o mesmo que o
# sequencial.
random_page_cost = 1.1
effective_io_concurrency = 200

# ---------------------------------------------------------------------
# Escrita
# ---------------------------------------------------------------------
# Importação de planilha grande gera MUITO WAL de uma vez. Com os valores
# padrão, o Postgres força checkpoints no meio da carga e ela engasga.
wal_buffers = 16MB
min_wal_size = 1GB
max_wal_size = 8GB
checkpoint_completion_target = 0.9

# ---------------------------------------------------------------------
# Paralelismo — 4 vCPU
# ---------------------------------------------------------------------
max_worker_processes = 4
max_parallel_workers = 4
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 2

# ---------------------------------------------------------------------
# Conexões
#
# Baixo de propósito. Quem fala com o banco é o pool do PostgREST (20) mais
# as conexões diretas do COPY. Número alto de conexões não acelera nada e
# multiplica o consumo de work_mem.
# ---------------------------------------------------------------------
max_connections = 100

# ---------------------------------------------------------------------
# Diagnóstico
#
# Sem isto, investigar lentidão vira adivinhação — foi medindo consulta a
# consulta que as materialized views do SADA foram justificadas.
# ---------------------------------------------------------------------
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = top
log_min_duration_statement = 2000
log_checkpoints = on
log_lock_waits = on
log_temp_files = 0

# Fuso dos logs, para bater com o horário de quem lê.
log_timezone = 'America/Sao_Paulo'
timezone = 'America/Sao_Paulo'
