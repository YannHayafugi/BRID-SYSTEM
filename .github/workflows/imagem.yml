# =====================================================================
# Constrói a imagem do app e publica no GHCR.
#
# POR QUE NÃO CONSTRUIR NO VPS: `next build` deste projeto é pesado (passa
# de dez minutos em máquina modesta) e come CPU e RAM. Construir na mesma
# máquina que serve o sistema deixaria o app lento a cada deploy, bem na
# hora em que alguém está esperando a mudança subir. Aqui o VPS só BAIXA a
# imagem pronta, o que leva segundos.
# =====================================================================

name: Imagem de produção

on:
  push:
    branches: [main]
    # Mudança só de documentação não precisa reconstruir nada.
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGEM: ${{ github.repository }}

jobs:
  construir:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Conferir tipos
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx tsc --noEmit

      # Os testes do SADA são de lógica pura — não tocam banco nem rede, e
      # por isso cabem aqui. É o que impede subir imagem com a conta de
      # páginas do documento ou a segmentação da carteira quebradas.
      - name: Testes do módulo
        run: |
          npm run sada:teste-debenture
          npm run sada:teste-categoria
          npm run sada:teste-tributario
          npm run sada:teste-depara
          npm run sada:teste-previsao
          npm run sada:teste-ingestao

      - uses: docker/setup-buildx-action@v3

      - name: Entrar no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Rótulos e tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGEM }}
          # A tag do commit é o que permite voltar à versão anterior
          # trocando uma linha no infra/.env.
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Construir e publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Inlinadas no bundle do navegador — não são segredo (a URL é
          # pública e a chave anônima existe para ficar no cliente), mas
          # ficam em "secrets" do repositório por serem de ambiente.
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
