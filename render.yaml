services:
  - type: web
    name: gerador-propostas
    runtime: docker
    plan: free
    autoDeploy: true
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: APP_SENHA
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-5
      - key: MAX_TR_CHARS
        value: "60000"
