<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gerador de Propostas</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <!-- TELA DE LOGIN -->
    <div id="tela-login">
      <div class="card-login">
        <img src="/logo.svg" alt="Logo" class="logo" />
        <h1>Gerador de Propostas</h1>
        <p class="sub">Acesse com sua senha</p>
        <form id="form-login">
          <input type="password" id="senha-login" placeholder="Senha" autocomplete="current-password" required />
          <button type="submit">Entrar</button>
          <p id="erro-login" class="erro-texto" hidden></p>
        </form>
      </div>
    </div>

    <!-- APP -->
    <div id="app" hidden>
      <header>
        <img src="/logo.svg" alt="Logo" class="logo logo-mini" />
        <nav>
          <button class="aba ativa" data-aba="gerador">Gerador de Proposta</button>
          <button class="aba" data-aba="enviados">Arquivos Enviados</button>
          <button class="aba" data-aba="gerados">Arquivos Gerados</button>
        </nav>
        <button id="sair">Sair</button>
      </header>

      <main>
        <!-- ABA GERADOR -->
        <section id="aba-gerador">
          <h2>Nova Proposta</h2>
          <p class="sub">Envie um Termo de Referência (PDF, DOCX ou TXT).</p>
          <form id="form">
            <label id="dropzone" for="arquivo">
              <span id="dz-texto">Arraste o TR aqui ou clique para selecionar</span>
              <input type="file" id="arquivo" accept=".pdf,.docx,.txt,.md" hidden />
            </label>
            <button type="submit" id="btn" disabled>Gerar Proposta</button>
          </form>
          <div id="status" hidden></div>
          <div id="resultado" hidden>
            <h3 id="titulo-proposta"></h3>
            <div class="downloads">
              <a id="dl-proposta" class="btn-dl">⬇ Baixar Proposta.docx</a>
              <a id="dl-resumo" class="btn-dl">⬇ Baixar Resumo.docx</a>
            </div>
            <dl id="resumo-info"></dl>
          </div>
        </section>

        <!-- ABA ENVIADOS -->
        <section id="aba-enviados" hidden>
          <h2>Arquivos Enviados</h2>
          <p class="sub">Termos de Referência já processados.</p>
          <div id="lista-enviados" class="lista"></div>
        </section>

        <!-- ABA GERADOS -->
        <section id="aba-gerados" hidden>
          <h2>Arquivos Gerados</h2>
          <p class="sub">Cada proposta gera dois documentos: a Proposta completa e o Resumo.</p>
          <div id="lista-gerados" class="lista"></div>
        </section>
      </main>
    </div>

    <script type="module" src="/main.js"></script>
  </body>
</html>
