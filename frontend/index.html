<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gerador de Propostas</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main>
      <h1>Gerador de Propostas</h1>
      <p class="sub">Envie um Termo de Referência (PDF, DOCX ou TXT) e receba a Proposta e o Resumo em Word.</p>

      <form id="form">
        <label id="dropzone" for="arquivo">
          <span id="dz-texto">Arraste o TR aqui ou clique para selecionar</span>
          <input type="file" id="arquivo" accept=".pdf,.docx,.txt,.md" hidden />
        </label>
        <button type="submit" id="btn" disabled>Gerar Proposta</button>
      </form>

      <div id="status" hidden></div>

      <section id="resultado" hidden>
        <h2 id="titulo-proposta"></h2>
        <div class="downloads">
          <a id="dl-proposta" class="btn-dl">⬇ Baixar Proposta.docx</a>
          <a id="dl-resumo" class="btn-dl">⬇ Baixar Resumo.docx</a>
        </div>
        <h3>Resumo</h3>
        <dl id="resumo-info"></dl>
      </section>
    </main>
    <script type="module" src="/main.js"></script>
  </body>
</html>
