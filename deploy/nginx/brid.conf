# Nginx — proxy reverso para o Next.js (PM2 na porta 3000).
#
# Instalação (etapa 6 de docs/DEPLOY-VPS.md):
#   sudo cp deploy/nginx/brid.conf /etc/nginx/sites-available/brid
#   sudo sed -i 's/SEU_DOMINIO/sistema.exemplo.com.br/g' /etc/nginx/sites-available/brid
#   sudo ln -s /etc/nginx/sites-available/brid /etc/nginx/sites-enabled/brid
#   sudo nginx -t && sudo systemctl reload nginx
#
# O HTTPS (bloco 443) é acrescentado pelo certbot na etapa 7.

server {
    listen 80;
    listen [::]:80;
    server_name SEU_DOMINIO;

    # Padrão do Nginx é 1 MB. Não basta: o upload do TR em PDF, os lotes da
    # importação do SADA e, principalmente, as planilhas grandes enviadas
    # inteiras ao servidor (docs/SADA-ARQUIVOS-GRANDES.md) passam disso e
    # voltariam 413. Ajuste para o maior arquivo que o ente manda.
    client_max_body_size 3g;
    # O corpo vai para disco em streaming; sem isto o Nginx tentaria
    # bufferizar vários GB em memória antes de repassar.
    client_body_buffer_size 1m;
    proxy_request_buffering off;

    # Na Vercel, /api/processos/[id]/gerar tinha maxDuration = 300. Aqui quem
    # corta é o Nginx (padrão 60 s) — sem isto a geração com IA cai no meio
    # com 504, mesmo o Node ainda trabalhando.
    proxy_connect_timeout 60s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Arquivos com hash no nome nunca mudam: cache longo no navegador.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
